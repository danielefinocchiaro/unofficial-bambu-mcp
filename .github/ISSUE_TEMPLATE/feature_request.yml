name: Feature request
description: Something you would like to ask the assistant to do.
labels: [enhancement]
body:
  - type: textarea
    id: ask
    attributes:
      label: What you would like to ask
      description: Write it the way you would ask the assistant.
      placeholder: '"Put a pause before the layer where the magnets go."'
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: In Bambu Studio, by hand, with another tool...
  - type: input
    id: printer
    attributes:
      label: Printer
      placeholder: A1 mini / P1S + AMS / ...
